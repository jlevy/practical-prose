# Git hooks managed by lefthook (https://lefthook.dev).
# Install once: `make hooks-install` (or `npx lefthook install`).
# Bypass for an emergency commit: `git commit --no-verify` (avoid in PRs).

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,html}"
      run: npx --no-install @biomejs/biome check --write {staged_files}
      stage_fixed: true

    # ruff lives in the pprose venv (`make install` creates it).
    ruff-format:
      glob: "*.py"
      exclude: ["**/_generated/**"]
      run: tools/pprose/.venv/bin/ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      exclude: ["**/_generated/**"]
      run: tools/pprose/.venv/bin/ruff check --fix {staged_files}
      stage_fixed: true

    # If anything under tools/design-system/ was touched, regenerate the
    # derivatives and stage any refreshed output alongside the edit.
    design-system-generate:
      glob: "tools/design-system/**"
      run: |
        uv run --script tools/design-system/generate.py
        git add tools/design-system/_generated/ \
                tools/pprose/src/pprose/_generated/design_system.py

    # Markdown formatting + resource-mirror sync, run SEQUENTIALLY in one command.
    #
    # ORDER IS LOAD-BEARING and these MUST NOT be split into separate parallel
    # hooks: `make format` (flowmark) reformats the canonical docs, then
    # sync_resources.py mirrors the *formatted* docs into the wheel and stages
    # them. As two parallel hooks they raced — sync could read a canonical doc
    # before flowmark finished reformatting it, committing a source/mirror
    # mismatch that the pre-push resources-sync-check then failed on. Folding
    # them into one ordered command removes the race; it still runs in parallel
    # with biome/ruff (which touch only non-Markdown files, so no contention).
    #
    # `make format` is the single source of truth (the same command developers
    # run locally): the pinned `uvx flowmark-rs@<version> --auto .` at the repo
    # root, which traverses the whole tree and honors .flowmarkignore. Whole-repo
    # (not {staged_files}) is required — flowmark-rs only reads .flowmarkignore
    # relative to its target arg, so passing subdirs/globs bypasses the exclusion
    # list and damages example-texts/ corpora and other vendored content.
    #
    # The mirrors under tools/pprose/src/pprose/resources/ are excluded from
    # flowmark (.flowmarkignore); they pick up formatting via this sync. The
    # canonical sources sync_resources mirrors are docs/, runbooks/, shortcuts/,
    # skills/, README.md (→ about), and design-system.md (→ guidelines) — all
    # Markdown, so the `*.md` glob covers every case that needs a resync.
    format-and-sync:
      glob: "*.md"
      run: |
        make format
        (cd tools/pprose && uv run python devtools/sync_resources.py)
        git add tools/pprose/src/pprose/resources/ skills/
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    generate-check:
      run: uv run --script tools/design-system/generate.py --check
    resources-sync-check:
      run: cd tools/pprose && uv run python devtools/sync_resources.py --check
    tests:
      run: cd tools/pprose && uv run pytest -q
