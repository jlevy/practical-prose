# Git hooks managed by lefthook (https://lefthook.dev).
# Install once: `make hooks-install` (or `npx lefthook install`).
# Bypass for an emergency commit: `git commit --no-verify` (avoid in PRs).

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,html}"
      run: npx --no-install @biomejs/biome check --write {staged_files}
      stage_fixed: true

    # ruff lives in the pprose venv (`make install` creates it).
    ruff-format:
      glob: "*.py"
      exclude: ["**/_generated/**"]
      run: tools/pprose/.venv/bin/ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      exclude: ["**/_generated/**"]
      run: tools/pprose/.venv/bin/ruff check --fix {staged_files}
      stage_fixed: true

    # If anything under tools/design-system/ was touched, regenerate the
    # derivatives and stage any refreshed output alongside the edit.
    design-system-generate:
      glob: "tools/design-system/**"
      run: |
        uv run --script tools/design-system/generate.py
        git add tools/design-system/_generated/ \
                tools/pprose/src/pprose/_generated/design_system.py

    # If any source doc that the pprose package vendors was touched,
    # resync the mirrors under tools/pprose/src/pprose/resources/ and
    # stage them alongside the edit. The mirrors are deliberately
    # excluded from flowmark (.flowmarkignore) — they pick up formatting
    # via this sync, not directly.
    # Keep this glob in lockstep with the canonical sources in
    # devtools/sync_resources.py (_synced_plan): docs/, runbooks/, shortcuts/,
    # skills/, plus README.md (→ about) and design-system.md (→ guidelines).
    # A source missing here drifts silently until the pre-push check fails.
    pprose-resources-sync:
      glob:
        - "README.md"
        - "docs/*.md"
        - "runbooks/*.md"
        - "shortcuts/*.md"
        - "skills/*/SKILL.md"
        - "tools/design-system/design-system.md"
      run: |
        (cd tools/pprose && uv run python devtools/sync_resources.py)
        git add tools/pprose/src/pprose/resources/ skills/

    # Markdown formatting with flowmark-rs (pinned in the Makefile).
    #
    # Single source of truth: delegates to `make format`, which is the same
    # command developers run locally. Both paths invoke the pinned
    # `uvx flowmark-rs@<version> --auto .` at the repo root so flowmark
    # traverses the whole tree and honors .flowmarkignore.
    #
    # Why whole-repo (not `{staged_files}`)? flowmark-rs only reads
    # .flowmarkignore relative to its target arg — passing subdirs or
    # globs bypasses the exclusion list and damages example-texts/ corpora
    # and other vendored content. Do not split this into per-dir hooks.
    #
    # The `glob: '*.md'` filter ensures the hook only fires when at least
    # one staged file is Markdown. Flowmark is fast (well under a second
    # across the whole repo with the incremental cache) so the whole-tree
    # scan is cheap.
    format-markdown:
      glob: "*.md"
      run: make format
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    generate-check:
      run: uv run --script tools/design-system/generate.py --check
    resources-sync-check:
      run: cd tools/pprose && uv run python devtools/sync_resources.py --check
    tests:
      run: cd tools/pprose && uv run pytest -q
