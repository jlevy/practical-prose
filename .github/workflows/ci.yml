# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

# Install strictly from the committed lockfile (SUPPLY-CHAIN-SECURITY.md: frozen
# installs). Without this, `uv sync` silently re-resolves when the lockfile was
# produced under resolution settings CI doesn't share (e.g. a contributor's global
# `exclude-newer`), so CI would test freshly resolved deps instead of the lock.
env:
  UV_FROZEN: "1"

jobs:
  build:
    strategy:
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}

    # The pprose tooling lives under tools/pprose/. All `run:` steps execute
    # from that directory so `uv sync`, `uv run pytest`, etc. operate on the
    # package without per-step `cd` chains.
    defaults:
      run:
        working-directory: tools/pprose

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v7
        with:
          # Update this as needed:
          version: "0.10.2"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      # Alternately can use the official Python action:
      # - name: Set up Python (using actions/setup-python)
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --all-extras

      - name: Run linting (check-only; fails on lint/format drift)
        run: uv run python devtools/lint.py --check

      - name: Verify bundled resources are in sync with canonical docs
        run: uv run python devtools/sync_resources.py --check

      - name: Run tests
        run: uv run pytest

  # Root-level checks for the design-system generator + JS toolchain, neither
  # of which depend on the pprose Python version matrix. Runs once per push.
  lint-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv python install

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies (locked)
        run: npm ci

      - name: Sync pprose dev tools (for ruff)
        run: uv sync --all-extras
        working-directory: tools/pprose

      - name: Verify design-system generated files are up to date
        run: uv run --script tools/design-system/generate.py --check

      - name: Lint design-system Python (top-level ruff.toml)
        run: |
          cd tools/pprose
          uv run ruff format --check ../../tools/design-system
          uv run ruff check ../../tools/design-system

      - name: Lint JS / CSS / HTML / JSON via Biome
        run: npx --no-install @biomejs/biome ci .

  # Build the wheel and exercise it from a clean, isolated install — catches
  # data-file packaging regressions (the pyproject `include=` list is long) that
  # the editable-source test run would not, before they reach a real release.
  wheel-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pprose
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv python install

      - name: Build sdist + wheel
        # Build into a clean out-dir so the glob can't match any stale wheel.
        run: uv build --out-dir /tmp/dist

      - name: Install the built wheel into a clean venv
        run: |
          uv venv /tmp/wheeltest --python 3.13
          uv pip install --python /tmp/wheeltest /tmp/dist/pprose-*.whl

      - name: Smoke-test the installed CLI (bundled resources resolve)
        run: |
          /tmp/wheeltest/bin/pprose --help
          /tmp/wheeltest/bin/pprose list
          /tmp/wheeltest/bin/pprose about | head -n 5