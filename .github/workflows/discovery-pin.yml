# Catches a release that was prepped and merged but never tagged.
#
# The committed skills under skills/ tell agents to run `uvx pprose@<DISCOVERY_VERSION>`.
# If that version was never published, every zero-install bootstrap fails for anyone who
# does not already have pprose on PATH. See
# tools/pprose/devtools/check_discovery_pin_published.py for why this is a scheduled job
# rather than a pull-request gate: the release procedure legitimately leaves main ahead
# of PyPI between the version bump and the tag.
name: Discovery pin published

on:
  schedule:
    # Daily at 08:17 UTC. Off the hour so it does not queue behind the scheduling spike.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_CONFIG: "1"
  UV_LOCKED: "1"
  UV_BUILD_CONSTRAINT: ${{ github.workspace }}/tools/pprose/build-constraints.txt

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/pprose

    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      # Exit 2 means PyPI was unreachable or returned something unexpected; that is an
      # infrastructure problem, not a dangling pin, so it must not read as a pass.
      - name: Check the discovery pin resolves on PyPI
        run: uv run --no-sync python devtools/check_discovery_pin_published.py
