name: Publish to PyPI

on:
  release:
    types: [published]

# Check and install strictly from committed, environment-neutral lock and constraint
# files; see SUPPLY-CHAIN-SECURITY.md and the matching note in ci.yml.
env:
  UV_NO_CONFIG: "1"
  UV_LOCKED: "1"
  UV_BUILD_CONSTRAINT: ${{ github.workspace }}/tools/pprose/build-constraints.txt

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read

    # The publishable package lives under tools/pprose/.
    defaults:
      run:
        working-directory: tools/pprose

    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Verify lockfile is up to date and environment-neutral
        run: |
          uv lock --check
          if grep -Eq '^\[options(\.|\])' uv.lock; then
            echo "uv.lock carries environment-specific [options] metadata"
            exit 1
          fi

      - name: Install all dependencies
        run: uv sync --all-extras

      # Fail fast if the release tag doesn't match the discovery pin baked into the
      # committed skills (DISCOVERY_VERSION).
      - name: Verify release tag matches baked discovery pin
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python devtools/check_release_version.py "$RELEASE_TAG"

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: >-
          uv build --no-config --build-constraint build-constraints.txt
          --require-hashes

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        # Although uv is newer and faster, the "official" publishing option is the one from PyPA,
        # which uses twine. If desired, replace `uv publish` with:
        # uses: pypa/gh-action-pypi-publish@release/v1
