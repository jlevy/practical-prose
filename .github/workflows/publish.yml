name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Enable manual trigger.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read

    # The publishable package lives under tools/pprose/.
    defaults:
      run:
        working-directory: tools/pprose

    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Install all dependencies
        run: uv sync --all-extras

      # Fail fast if the release tag doesn't match the discovery pin baked into the
      # committed skills (DISCOVERY_VERSION). Only meaningful for tag-driven releases;
      # a manual workflow_dispatch run carries the publisher's own responsibility.
      - name: Verify release tag matches baked discovery pin
        if: github.event_name == 'release'
        run: uv run python devtools/check_release_version.py "${{ github.ref_name }}"

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        # Although uv is newer and faster, the "official" publishing option is the one from PyPA,
        # which uses twine. If desired, replace `uv publish` with:
        # uses: pypa/gh-action-pypi-publish@release/v1
